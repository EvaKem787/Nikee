<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container container-header">
            <img class="logo" src="н.jpeg" alt="">
            <h3>найки</h3>
            <nav>
                <ul class="list">
                    <li class="item">главная</li>
                    <li class="item">галерея</li>
                    <li class="item">о найках</li>
                    <li class="item">видео</li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="container container-hero">
                <img class="hero__img" src="найкии.webp" alt="">
                <div class="info">
                    <h3>найки
                    </h3>
                    <p>Nike — мировой лидер в производстве спортивной одежды и обуви. Мы создаём экипировку для атлетов
                        всех уровней: от начинающих любителей до профессиональных чемпионов.

                    </p><button>заказать</button>
                </div>
            </div>
        </section>
        <section class="about">
            <div class="container container-about">
                <h3 class="about__headline">
                    О бренде
                </h3>
                <div class="about__info">
                    <ul class="about__list">
                        <li class="about__item">
                            <h4 class="about__name">качество</h4>
                            <div class="about__full">
                                <div class="about__fill"></div>
                            </div>
                        </li>
                        <li class="about__item">
                            <h4 class="about__name">комфорт</h4>
                            <div class="about__full">
                                <div class="about__fill"></div>
                            </div>
                        </li>
                        <li class="about__item">
                            <h4 class="about__name">дизайн</h4>
                            <div class="about__full">
                                <div class="about__fill"></div>
                            </div>
                        </li>
                    </ul>
                    <img class="about__paint" src="i.webp" alt="">
                </div>
            </div>
        </section>
        <section class="video">
            <div class="container container-video">
                <h3 class="video__headline">Видео</h3><iframe class="video__video"
                    src="https://www.youtube.com/embed/vrgIlr58X6M?si=VZoX8B8BY-pXzWi6" title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </section>
        <section class="gallery">
            <div class="container container-gallery">
                <h3 class="gallery__title">Галерея</h3>
            <ul class="gallery__list">
                <li class="gallery__item"><img src="на1.jpeg" alt="" class="gallery__img"></li>
                <li class="gallery__item"><img src="на2.webp" alt="" class="gallery__img"></li>
                <li class="gallery__item"><img src="на3.jpeg" alt="" class="gallery__img"></li>
                <li class="gallery__item"><img src="на4.jpeg" alt="" class="gallery__img"></li>
                <li class="gallery__item"><img src="на5.jpeg" alt="" class="gallery__img"></li>
                <li class="gallery__item"><img src="на6.jpeg" alt="" class="gallery__img"></li>
            </ul>
            </div>
        </section>
    </main>
    <footer></footer>
</body>

</html>
